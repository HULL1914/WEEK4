<!DOCTYPE HTML>
<html>

<HEAD>
     <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>




</HEAD>




<body>

    <div id="map" style="height:512px; width:512px; border:1px solid grey; padding:5px;"></div>
    <button id="button-left">&lt;</button>
    <button id="button-right">&gt;</button>


<script>
let date1 = '2026-01-01';
let date2 = '2026-01-10';
let east = -60;
let west = east + 100;

let key = '31026835ac803fad21b9077c3250e9d0'

update_map(east, west, date1, date2);

function update_map(east, west, date1, date2) {

   let src = `https://firms.modaps.eosdis.nasa.gov/mapserver/wms/fires/${key}/?REQUEST=GetMap&layers=fires_modis&COLORS=220+100+100&TIME=${date1}/${date2}&WIDTH=512&HEIGHT=512&BBOX=${east},-90,${west},90`;
   console.log(src);
   $('#map').html(`<img src="${src}">`);

}

$("#button-left").click(function() {
    east -= 10;
    west = east + 100;
    update_map(east, west, date1, date2);
    if (east <= -180) {
        this.disabled = true;
        if ($("#button-right").prop('disabled')) {
            $("#button-right").prop('disabled', false);
        }
    }
})

$("#button-right").click(function() {
    east += 10;
    west = east + 100;
    update_map(east, west, date1, date2);
    if (east >= 0) {
        this.disabled = true;
        if ($("#button-left").prop('disabled')) {
            $("#button-left").prop('disabled', false);
        }
    }
})

</script>











</body>

















</html>
